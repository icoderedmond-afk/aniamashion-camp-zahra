<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Shooter - Final Boss at 10,000</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #111;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        #ui {
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            gap: 20px;
        }
        .hud-item {
            background: #222;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        .boss-alert {
            color: #ff3333;
            animation: flash 1s infinite alternate;
        }
        @keyframes flash {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="hud-item">Score: <span id="scoreVal">0</span> / 10,000</div>
        <div class="hud-item">Health: <span id="healthVal">100</span></div>
        <div class="hud-item" id="statusMsg">Status: Fighting Mobs</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State
        let score = 0;
        let health = 100;
        let gameOver = false;
        let gameWon = false;
        const finalBossScoreTrigger = 10000; 
        let finalBossSpawned = false;

        // Player Object
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 18,
            speed: 4,
            angle: 0
        };

        // Inputs & Collections
        const keys = {};
        let mouse = { x: 0, y: 0 };
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let boss = null;

        // Event Listeners
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
        window.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        window.addEventListener("mousedown", () => {
            if (gameOver || gameWon) {
                resetGame();
                return;
            }
            shootBullet();
        });

        function shootBullet() {
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 8,
                dy: Math.sin(angle) * 8,
                radius: 4
            });
        }

        function spawnEnemy() {
            if (gameOver || gameWon || boss !== null) return; 
            const side = Math.floor(Math.random() * 4);
            let ex, ey;
            if (side === 0) { ex = Math.random() * canvas.width; ey = -20; }
            else if (side === 1) { ex = canvas.width + 20; ey = Math.random() * canvas.height; }
            else if (side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 20; }
            else { ex = -20; ey = Math.random() * canvas.height; }

            enemies.push({
                x: ex,
                y: ey,
                radius: 14,
                speed: 2
            });
        }

        setInterval(spawnEnemy, 1500);

        function spawnBoss() {
            boss = {
                x: canvas.width / 2,
                y: -60,
                radius: 55,
                health: 200,
                maxHealth: 200,
                speed: 1.2,
                shootTimer: 0,
                isFinalBoss: true
            };
            document.getElementById("statusMsg").innerHTML = "Status: <span class='boss-alert'>FINAL BOSS: THE OMEGA OVERLORD!</span>";
        }

        function resetGame() {
            score = 0;
            health = 100;
            bullets = [];
            enemyBullets = [];
            enemies = [];
            boss = null;
            gameOver = false;
            gameWon = false;
            finalBossSpawned = false;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            document.getElementById("statusMsg").innerText = "Status: Fighting Mobs";
        }

        function update() {
            if (gameOver || gameWon) return;

            // Check for Final Boss Trigger at 10,000 points (NO MINI BOSSES)
            if (score >= finalBossScoreTrigger && !finalBossSpawned) {
                finalBossSpawned = true;
                enemies = []; // Clear standard mobs
                spawnBoss();
            }

            // Player Movement (WASD)
            if (keys['w'] && player.y > player.radius) player.y -= player.speed;
            if (keys['s'] && player.y < canvas.height - player.radius) player.y += player.speed;
            if (keys['a'] && player.x > player.radius) player.x -= player.speed;
            if (keys['d'] && player.x < canvas.width - player.radius) player.x += player.speed;

            // Update Player Aim Angle
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // Update Player Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].dx;
                bullets[i].y += bullets[i].dy;

                if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Update Enemy Bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].x += enemyBullets[i].dx;
                enemyBullets[i].y += enemyBullets[i].dy;

                const dist = Math.hypot(player.x - enemyBullets[i].x, player.y - enemyBullets[i].y);
                if (dist < player.radius + enemyBullets[i].radius) {
                    health -= 20;
                    enemyBullets.splice(i, 1);
                    if (health <= 0) gameOver = true;
                    continue;
                }

                if (enemyBullets[i].x < 0 || enemyBullets[i].x > canvas.width || enemyBullets[i].y < 0 || enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                }
            }

            // Update Regular Enemies (Only spawn/update if final boss hasn't spawned yet)
            if (!finalBossSpawned) {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const en = enemies[i];
                    const angle = Math.atan2(player.y - en.y, player.x - en.x);
                    en.x += Math.cos(angle) * en.speed;
                    en.y += Math.sin(angle) * en.speed;

                    const distToPlayer = Math.hypot(player.x - en.x, player.y - en.y);
                    if (distToPlayer < player.radius + en.radius) {
                        health -= 10;
                        enemies.splice(i, 1);
                        if (health <= 0) gameOver = true;
                        continue;
                    }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        const distToBullet = Math.hypot(b.x - en.x, b.y - en.y);
                        if (distToBullet < en.radius + b.radius) {
                            score += 100;
                            enemies.splice(i, 1);
                            bullets.splice(j, 1);
                            break;
                        }
                    }
                }
            }

            // Update Boss Logic
            if (boss !== null) {
                const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                boss.x += Math.cos(angle) * boss.speed;
                boss.y += Math.sin(angle) * boss.speed;

                boss.shootTimer++;
                if (boss.shootTimer >= 50) {
                    boss.shootTimer = 0;
                    let spreadCount = 5;
                    
                    for (let a = -1; a <= 1; a += (2 / (spreadCount - 1))) {
                        const shootAngle = angle + (a * 0.4);
                        enemyBullets.push({
                            x: boss.x,
                            y: boss.y,
                            dx: Math.cos(shootAngle) * 5,
                            dy: Math.sin(shootAngle) * 5,
                            radius: 7
                        });
                    }
                }

                if (Math.hypot(player.x - boss.x, player.y - boss.y) < player.radius + boss.radius) {
                    health -= 5; 
                    if (health <= 0) gameOver = true;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (Math.hypot(b.x - boss.x, b.y - boss.y) < boss.radius + b.radius) {
                        boss.health--;
                        bullets.splice(j, 1);
                        if (boss.health <= 0) {
                            gameWon = true; // WIN CONDITION MET!
                        }
                        break;
                    }
                }
            }

            document.getElementById("scoreVal").innerText = score;
            document.getElementById("healthVal").innerText = Math.max(0, health);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Bullets
            ctx.fillStyle = "#0ff";
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Enemy Bullets
            ctx.fillStyle = "#ff00ff";
            for (let eb of enemyBullets) {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Regular Enemies
            ctx.fillStyle = "#ff3366";
            for (let en of enemies) {
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Boss
            if (boss !== null) {
                ctx.fillStyle = "#ff0055";
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
                ctx.fill();

                // Boss Health Bar
                ctx.fillStyle = "#444";
                ctx.fillRect(boss.x - 50, boss.y - 70, 100, 10);
                ctx.fillStyle = "#ff0000";
                ctx.fillRect(boss.x - 50, boss.y - 70, (boss.health / boss.maxHealth) * 100, 10);
            }

            // Draw Player Hero
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            ctx.fillStyle = "#ffcc00";
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#fff";
            ctx.fillRect(0, -4, player.radius + 6, 8);
            ctx.restore();

            // Game Over Screen
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = "18px Arial";
                ctx.fillText("Click anywhere to Restart", canvas.width / 2, canvas.height / 2 + 20);
            }

            // Victory Screen
            if (gameWon) {
                ctx.fillStyle = "rgba(0, 20, 40, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00ffcc";
                ctx.font = "35px Arial";
                ctx.textAlign = "center";
                ctx.fillText("VICTORY!", canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.fillText("You defeated the Omega Overlord!", canvas.width / 2, canvas.height / 2 + 10);

                ctx.font = "16px Arial";
                ctx.fillText("Click anywhere to Play Again", canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
